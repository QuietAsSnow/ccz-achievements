    @media (max-width: 640px) {

  </main>
  <footer>吞噬三国之曹操传 · 成就徽章展示</footer>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head"><h2 id="viewer-title"></h2><button class="viewer-close" id="close" type="button" aria-label="关闭大图">×</button></div>
    <img class="viewer-img" id="viewer-img" alt="">
    <div class="viewer-foot">
      <div class="nav"><button id="previous" type="button" aria-label="上一枚">‹</button><span id="position"></span><button id="next" type="button" aria-label="下一枚">›</button></div>
      <button class="copy" id="copy" type="button">复制此徽章链接</button>
    </div>
  </dialog>
  <script>
    const cards = [...document.querySelectorAll(".card")];
    const viewer = document.getElementById("viewer");
    const image = document.getElementById("viewer-img");
    const title = document.getElementById("viewer-title");
    const position = document.getElementById("position");
    const search = document.getElementById("search");
    let current = -1;

    function openCard(index, updateHash = true) {
      if (index < 0 || index >= cards.length) return;
      current = index;
      const card = cards[index];
      title.textContent = card.dataset.name;
      image.src = `images/${card.dataset.id}.webp`;
      image.alt = `${card.dataset.name}徽章大图`;
      position.textContent = `${index + 1} / ${cards.length}`;
      if (!viewer.open) viewer.showModal();
      if (updateHash) history.replaceState(null, "", `#${card.dataset.id}`);
    }
    function closeViewer() {
      if (viewer.open) viewer.close();
      current = -1;
      history.replaceState(null, "", location.pathname + location.search);
    }
    document.getElementById("grid").addEventListener("click", event => {
      const card = event.target.closest(".card");
      if (card) openCard(cards.indexOf(card));
    });
    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase();
      let visible = 0;
      cards.forEach(card => {
        card.hidden = !card.dataset.name.toLocaleLowerCase().includes(query);
        if (!card.hidden) visible++;
      });
      document.getElementById("count").textContent = visible;
      document.getElementById("empty").hidden = visible > 0;
    });
    document.getElementById("close").addEventListener("click", closeViewer);
    viewer.addEventListener("click", event => { if (event.target === viewer) closeViewer(); });
    viewer.addEventListener("close", () => {
      if (current >= 0) closeViewer();
    });
    document.getElementById("previous").addEventListener("click", () => openCard((current + cards.length - 1) % cards.length));
    document.getElementById("next").addEventListener("click", () => openCard((current + 1) % cards.length));
    document.addEventListener("keydown", event => {
      if (!viewer.open) return;
      if (event.key === "ArrowLeft") openCard((current + cards.length - 1) % cards.length);
      if (event.key === "ArrowRight") openCard((current + 1) % cards.length);
    });
    const copyButton = document.getElementById("copy");
    if (location.protocol === "file:") {
      copyButton.disabled = true;
      copyButton.textContent = "上线后可复制链接";
    }
    copyButton.addEventListener("click", async event => {
      try {
        await navigator.clipboard.writeText(location.href);
        event.currentTarget.textContent = "链接已复制";
        setTimeout(() => { event.currentTarget.textContent = "复制此徽章链接"; }, 1800);
      } catch {
        event.currentTarget.textContent = "请复制地址栏链接";
      }
    });
    function openFromHash() {
      const id = location.hash.slice(1);
      const index = cards.findIndex(card => card.dataset.id === id);
      if (index >= 0) openCard(index, false);
      else if (viewer.open) closeViewer();
    }
    window.addEventListener("hashchange", openFromHash);
    openFromHash();
  </script>
